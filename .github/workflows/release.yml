name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: prototypes/electron
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototypes/electron/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Write the App Store Connect key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Package
        run: |
          signing=()
          # Hardened runtime rejects ad-hoc signed frameworks, so it is only used with a Developer ID certificate.
          if [ -z "$CSC_LINK" ]; then signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          npm run build
          npx electron-builder --mac --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}" "${signing[@]}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip \
            --title "Yalqen ${GITHUB_REF_NAME#v}" \
            --notes-file build/release-notes.md \
            --generate-notes
