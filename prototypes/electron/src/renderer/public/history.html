<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geçmiş</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #e6e8eb;
        --text: #1a1b1e;
        --muted: #6b6e75;
        --surface: #fff;
        --border: #d3d6da;
        --hover: #f1f2f4;
        --accent: #f28c28;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141517;
          --text: #eceef1;
          --muted: #9a9ea6;
          --surface: #26282c;
          --border: #373a40;
          --hover: #33363b;
          --accent: #f28c28;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      }
      main { width: min(780px, 100%); margin: 0 auto; padding: 42px 24px 80px; }
      h1 { margin: 0 0 24px; font-size: 30px; letter-spacing: -.03em; }
      form { margin-bottom: 30px; }
      input {
        width: 100%; height: 44px; padding: 0 16px;
        border: 1px solid var(--border); border-radius: 12px;
        outline: none; background: var(--surface); color: var(--text);
        font: inherit; font-size: 15px;
      }
      input:focus { border-color: var(--accent); }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .summary { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
      .clear { color: var(--accent); }
      ol { margin: 0; padding: 0; list-style: none; }
      .day h2 { margin: 30px 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
      ol > li:not(.day) { display: flex; align-items: center; min-height: 62px; gap: 14px; border-bottom: 1px solid var(--border); }
      time { flex: 0 0 42px; color: var(--muted); font-size: 12px; }
      .visit { display: flex; flex: 1; flex-direction: column; min-width: 0; padding: 9px 0; }
      .visit strong, .visit span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .visit strong { font-weight: 500; }
      .visit span { color: var(--muted); font-size: 12px; }
      .visit:hover strong { color: var(--accent); }
      .remove { display: grid; flex: 0 0 30px; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
      .remove:hover { background: var(--hover); color: var(--text); }
      .empty { margin-top: 48px; color: var(--muted); text-align: center; }
      .confirm { padding: 35px; border-radius: 16px; background: var(--surface); }
      .confirm h2 { margin: 0 0 8px; font-size: 21px; }
      .confirm p { color: var(--muted); }
      .confirm-actions { display: flex; gap: 24px; margin-top: 28px; }
      .confirm-actions a { color: var(--accent); }
      .confirm-actions .danger { color: #c94d4d; }
    </style>
  </head>
  <body><main><h1>Geçmiş</h1><!-- visits --></main></body>
</html>
