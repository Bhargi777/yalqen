<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yer imleri</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #e6e8eb;
        --text: #1a1b1e;
        --muted: #6b6e75;
        --surface: #fff;
        --border: #d3d6da;
        --accent: #f28c28;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141517;
          --text: #eceef1;
          --muted: #9a9ea6;
          --surface: #26282c;
          --border: #373a40;
          --accent: #f28c28;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      }
      main { width: min(780px, 100%); margin: 0 auto; padding: 42px 24px 80px; }
      h1 { margin: 0 0 24px; font-size: 30px; letter-spacing: -.03em; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      form { display: flex; gap: 8px; }
      input, select {
        min-width: 0; height: 34px; padding: 0 12px;
        border: 1px solid var(--border); border-radius: 10px;
        outline: none; background: var(--surface); color: var(--text); font: inherit;
      }
      input:focus, select:focus { border-color: var(--accent); }
      .search { margin-bottom: 12px; }
      .search input { flex: 1; height: 44px; font-size: 15px; }
      .new-folder { margin-bottom: 24px; }
      .new-folder input { flex: 1; }
      button { flex: none; height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
      section { margin-bottom: 24px; }
      .folder { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      h2 { margin: 12px 0 4px; color: var(--muted); font-size: 13px; font-weight: 600; }
      ol { margin: 0; padding: 0; list-style: none; }
      li { display: flex; flex-wrap: wrap; align-items: center; min-height: 58px; gap: 4px 14px; border-bottom: 1px solid var(--border); }
      .visit { display: flex; flex: 1; flex-direction: column; min-width: 0; padding: 9px 0; }
      .visit strong, .visit span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .visit strong { font-weight: 500; }
      .visit span { color: var(--muted); font-size: 12px; }
      .visit:hover strong { color: var(--accent); }
      summary { color: var(--muted); font-size: 13px; cursor: default; }
      details[open] { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 12px; }
      details[open] summary { flex-basis: 100%; }
      .danger { color: #c94d4d; font-size: 13px; }
      .empty { margin-top: 48px; color: var(--muted); text-align: center; }
      .empty-folder { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body><main><h1>Yer imleri</h1>__YALQEN_BOOKMARKS_SLOT__</main></body>
</html>
