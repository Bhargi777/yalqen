<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yeni sekme</title>
    <!--
      Served as yalqen://newtab/ by the main process, which fills in the recently
      closed pages. The search form submits to yalqen://newtab/search?q=…, which the
      main process turns into a navigation; the page itself runs no scripts.
    -->
    <style>
      :root {
        --page: #f2f0ed;
        --text: #161514;
        --muted: #77716b;
        --surface: #fff;
        --accent: #f47721;
        --accent-dark: #df5b0b;
        --line: rgb(32 25 18 / 0.09);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--page);
        color: var(--text);
        font: 15px / 1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      main {
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 48px);
        margin: 24px;
        padding: 30px clamp(24px, 5vw, 84px) 34px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 16px 60px rgb(47 36 23 / 0.08);
      }

      main::before,
      main::after {
        position: absolute;
        z-index: -1;
        content: '';
        pointer-events: none;
      }

      main::before {
        top: -280px;
        right: -215px;
        width: min(68vw, 910px);
        height: min(68vw, 910px);
        border-radius: 43% 57% 53% 47% / 38% 44% 56% 62%;
        background: radial-gradient(ellipse at 32% 38%, #ffb36a 0%, #ff8a36 33%, #f36b18 62%, #e95b12 100%);
        filter: blur(1px);
        opacity: 0.95;
      }

      main::after {
        right: 13%;
        bottom: -380px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 195 139 / 0.5), rgb(255 239 224 / 0) 68%);
      }

      .topbar {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: 50px;
      }

      .availability {
        display: inline-flex;
        justify-self: start;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 19px;
        border: 1px solid rgb(255 255 255 / 0.8);
        border-radius: 999px;
        background: rgb(255 255 255 / 0.77);
        box-shadow: 0 8px 24px rgb(120 67 25 / 0.1);
        color: #302820;
        font-size: 13px;
        font-weight: 550;
        backdrop-filter: blur(14px);
      }

      .availability-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3aa76d;
        box-shadow: 0 0 0 3px rgb(58 167 109 / 0.12);
      }

      .wordmark {
        font-size: 25px;
        font-weight: 720;
        letter-spacing: -0.065em;
      }

      .wordmark span,
      .hero-title span {
        color: var(--accent);
      }

      .top-link {
        display: inline-flex;
        justify-self: end;
        align-items: center;
        gap: 15px;
        min-height: 48px;
        padding: 0 19px;
        border: 1px solid rgb(255 255 255 / 0.55);
        border-radius: 999px;
        background: rgb(228 84 12 / 0.88);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 8px 22px rgb(124 47 9 / 0.14);
      }

      .top-link svg {
        opacity: 0.8;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(290px, 0.6fr);
        align-items: end;
        gap: clamp(32px, 7vw, 120px);
        flex: 1;
        min-height: 490px;
        padding: 60px 0 56px;
      }

      .hero-title {
        align-self: end;
        min-width: 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 20px 8px;
        color: var(--accent-dark);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .eyebrow::before {
        width: 22px;
        height: 1px;
        background: currentColor;
        content: '';
      }

      .hero-title h1 {
        margin: 0;
        font-size: clamp(92px, 14vw, 280px);
        font-weight: 720;
        letter-spacing: -0.105em;
        line-height: 0.77;
      }

      .hero-aside {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: min(100%, 390px);
        margin: 0 0 8px auto;
      }

      .hero-copy {
        max-width: 350px;
        margin: 0 0 26px;
        color: #383430;
        font-size: clamp(16px, 1.4vw, 20px);
        line-height: 1.55;
      }

      #search-form {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 58px;
        padding: 6px 7px 6px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(52 39 27 / 0.09);
      }

      .search-icon {
        display: grid;
        flex: none;
        place-items: center;
        color: #918980;
      }

      .prompt {
        flex: 1;
        min-width: 0;
        height: 42px;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        user-select: text;
      }

      .prompt::placeholder {
        color: #948e88;
        opacity: 1;
      }

      .welcome {
        margin: 13px 0 0 5px;
        color: #716960;
        font-size: 12px;
      }

      .search-submit {
        display: grid;
        flex: none;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: transform 150ms var(--ease-out), background-color 150ms ease;
      }

      .search-submit:hover {
        background: var(--accent-dark);
      }

      .search-submit:active {
        transform: scale(0.97);
      }

      .welcome-start {
        margin-top: 7px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #514942;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .welcome-start span {
        margin-left: 6px;
        color: var(--accent-dark);
      }

      .recent-section {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 54px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .recent-section:empty {
        display: none;
      }

      h2 {
        flex: none;
        margin: 0;
        color: #746d65;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .recent {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .recent li {
        display: flex;
        align-items: center;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #756e67;
        transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
      }

      .recent li:hover {
        border-color: rgb(244 119 33 / 0.28);
        background: #fff8f2;
        color: var(--text);
      }

      .recent a:first-child {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        height: 100%;
        padding: 0 12px;
      }

      .recent span:last-child {
        max-width: 170px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .recent img,
      .dot {
        flex: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
      }

      .dot {
        background: #f6e8db;
      }

      .forget {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-right: 5px;
        border-radius: 50%;
        color: #807970;
      }

      .forget:hover {
        background: rgb(244 119 33 / 0.1);
      }

      @media (max-width: 760px) {
        main {
          min-height: calc(100vh - 24px);
          margin: 12px;
          padding: 20px 24px 24px;
        }

        main::before {
          top: -130px;
          right: -220px;
          width: 520px;
          height: 520px;
        }

        .hero {
          grid-template-columns: 1fr;
          align-content: center;
          gap: 44px;
          min-height: 0;
          padding: 90px 0 64px;
        }

        .hero-title h1 {
          font-size: clamp(110px, 25vw, 190px);
        }

        .hero-aside {
          margin-left: 0;
        }
      }

      @media (max-width: 480px) {
        main {
          min-height: calc(100vh - 16px);
          margin: 8px;
          padding: 16px 18px 20px;
        }

        .topbar {
          grid-template-columns: 1fr auto;
        }

        .wordmark {
          display: none;
        }

        .availability,
        .top-link {
          min-height: 42px;
          padding: 0 13px;
          font-size: 11px;
        }

        .hero {
          gap: 34px;
          padding: 76px 0 52px;
        }

        .hero-title h1 {
          font-size: clamp(96px, 26vw, 130px);
        }

        .hero-copy {
          margin-bottom: 18px;
          font-size: 16px;
        }

        .recent-section {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <span class="availability"><span class="availability-dot" aria-hidden="true"></span>Odaklanmaya hazır</span>
        <a class="wordmark" href="yalqen://newtab/" aria-label="Yalqen ana sayfa">Yalqen<span>.</span></a>
        <a class="top-link" href="yalqen://history/" aria-label="Geçmişi aç">
          Geçmiş
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M8 3l5 5-5 5" /></svg>
        </a>
      </header>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-title">
          <p class="eyebrow">DAHA SADE BİR WEB</p>
          <h1 id="hero-title">Yalqen<span>.</span></h1>
        </div>
        <div class="hero-aside">
          <p class="hero-copy">İnternette kendi yolunu aç. Aramak ya da bir adres yazmak için başlayabilirsin.</p>
          <form id="search-form" action="yalqen://newtab/search" method="get" role="search">
            <span class="search-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.8" cy="8.8" r="5.8" /><path d="m13.2 13.2 4 4" /></svg>
            </span>
            <input id="q" class="prompt" name="q" type="text" placeholder="Ara veya adres yaz…" aria-label="Ara veya adres yaz" autocomplete="off" spellcheck="false" autofocus />
            <button class="search-submit" type="submit" aria-label="Ara">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h11M10 5l5 5-5 5" /></svg>
            </button>
          </form>
          <!-- welcome -->
          <!-- welcome-action -->
        </div>
      </section>
      <section class="recent-section" aria-label="Son kapatılan sayfalar"><!-- recent --></section>
    </main>
  </body>
</html>
