<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yeni sekme</title>
    <!--
      Served as yalqen://newtab/ by the main process, which fills in the recently
      closed pages. Links to yalqen://newtab/search open the centered address bar.
    -->
    <style>
      /* The page matches the window background, so the new tab reads as an empty board. */
      :root {
        --page: #e6e8eb;
        --text: #1a1b1e;
        --hint: #a4a7ad;
        --muted: #6b6e75;
        --surface: #ffffff;
        --well: #dcdfe3;
        --hover: rgb(0 0 0 / 0.04);
        --shadow: 0 0 0 0.5px rgb(16 18 24 / 0.08), 0 1px 3px rgb(16 18 24 / 0.08);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141517;
          --text: #eceef1;
          --hint: #53565d;
          --muted: #9a9ea6;
          --surface: #26282c;
          --well: #1e2023;
          --hover: rgb(255 255 255 / 0.05);
          --shadow: 0 0 0 0.5px rgb(255 255 255 / 0.1), 0 1px 3px rgb(0 0 0 / 0.3);
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font: 15px / 1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, 100%);
        padding: 0 24px 6vh;
      }

      .prompt {
        color: var(--hint);
        font-size: clamp(40px, 6.4vw, 80px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
        transition: color 120ms ease-out;
      }

      .prompt:hover {
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 6px;
        margin-top: 36px;
      }

      .pill {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .pill.square {
        justify-content: center;
        width: 44px;
        padding: 0;
      }

      .blank {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--well);
      }

      .pill svg {
        color: var(--muted);
      }

      h2 {
        margin: 22px 0 12px;
        font-size: 15px;
        font-weight: 500;
      }

      .recent {
        width: 260px;
        margin: 0;
        padding: 6px;
        border-radius: 16px;
        background: var(--well);
        list-style: none;
      }

      .recent li {
        display: flex;
        align-items: center;
        height: 48px;
        border-radius: 11px;
        color: var(--muted);
      }

      .recent li:hover {
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--text);
      }

      .recent a:first-child {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 12px;
        min-width: 0;
        height: 100%;
        padding: 0 14px;
      }

      .forget {
        display: grid;
        flex: none;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-right: 10px;
        border-radius: 7px;
        color: var(--text);
      }

      .forget:hover {
        background: var(--hover);
      }

      .recent span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recent img,
      .dot {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 5px;
      }

      .dot {
        background: var(--surface);
        box-shadow: var(--shadow);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="prompt" href="yalqen://newtab/search">Aramak için yaz…</a>
      <div class="actions">
        <a class="pill" href="yalqen://newtab/search">
          <span class="blank"></span>
          <span>Yeni sekme</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 4.5h8M2.5 8h8M2.5 11.5h5M12 10v4M10 12h4" />
          </svg>
        </a>
        <a class="pill square" href="yalqen://newtab/search" aria-label="Ara veya adres yaz">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M8 3v10M3 8h10" />
          </svg>
        </a>
      </div>
      <!-- recent -->
    </main>
  </body>
</html>
