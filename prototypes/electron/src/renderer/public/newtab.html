<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yeni sekme</title>
    <!--
      Served as yalqen://newtab/ by the main process, which fills in the recently
      closed pages. Links to yalqen://newtab/search focus the tab's search field.
    -->
    <style>
      /* The page matches the window background, so the new tab reads as an empty board. */
      :root {
        --page: #e6e8eb;
        --text: #1a1b1e;
        --mark: #cfd2d7;
        --muted: #8a8d94;
        --hover: rgb(16 18 24 / 0.05);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141517;
          --text: #eceef1;
          --mark: #2a2c30;
          --muted: #6f737a;
          --hover: rgb(255 255 255 / 0.05);
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font: 13px / 1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding-bottom: 6vh;
      }

      .mark {
        color: var(--mark);
        transition: color 120ms ease-out;
      }

      .mark:hover {
        color: var(--muted);
      }

      .recent {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 220px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .recent li {
        display: flex;
        align-items: center;
        height: 30px;
        border-radius: 999px;
        color: var(--muted);
      }

      .recent li:hover {
        background: var(--hover);
        color: var(--text);
      }

      .recent a:first-child {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 9px;
        min-width: 0;
        height: 100%;
        padding: 0 12px;
      }

      .recent span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recent img,
      .dot {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 4px;
      }

      .recent li:not(:hover) img {
        opacity: 0.6;
      }

      .dot {
        background: var(--hover);
      }

      .forget {
        display: grid;
        flex: none;
        place-items: center;
        width: 22px;
        height: 22px;
        margin-right: 4px;
        border-radius: 50%;
        visibility: hidden;
      }

      .recent li:hover .forget {
        visibility: visible;
      }

      .forget:hover {
        background: var(--hover);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="mark" href="yalqen://newtab/search" aria-label="Ara veya adres yaz">
        <svg viewBox="274 254 482 622" width="34" height="44" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="110" stroke-linecap="round">
            <path d="M330 310 L450 470" />
            <path d="M700 310 L470 770 Q445 820 385 820" />
          </g>
        </svg>
      </a>
      <!-- recent -->
    </main>
  </body>
</html>
