<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yeni sekme</title>
    <!--
      Served as yalqen://newtab/ by the main process, which adds class="animate"
      to <html> on the first new tab page of each launch.
    -->
    <style>
      :root {
        --page: #fbf9fc;
        --text: #211c27;
        --muted: #77717d;
        --border: #e8e0eb;
        --card: rgb(255 255 255 / 0.78);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #211d27;
          --text: #f3eef6;
          --muted: #b3aab9;
          --border: #3b3443;
          --card: rgb(255 255 255 / 0.06);
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: radial-gradient(circle at 50% 30%, #f1e9f8 0, var(--page) 48%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        overflow: hidden;
        user-select: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(circle at 50% 30%, #30253c 0, var(--page) 50%);
        }
      }

      .start {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(760px, 100%);
        height: 100%;
        margin: 0 auto;
        padding: 34px 32px 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        align-self: flex-start;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .brand svg {
        width: 20px;
        height: 26px;
      }

      .welcome {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding-bottom: 8vh;
        text-align: center;
      }

      .eyebrow {
        color: #7652a7;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (prefers-color-scheme: dark) {
        .eyebrow {
          color: #c4a7e5;
        }
      }

      .wordmark {
        width: min(420px, 72vw);
        height: auto;
        margin: 18px 0 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 3vw, 36px);
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      p {
        margin: 12px 0 28px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .shortcut {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px 10px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        box-shadow: 0 8px 32px rgb(64 37 87 / 0.05);
        color: var(--muted);
        font-size: 12px;
      }

      kbd {
        padding: 4px 7px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--page);
        color: var(--text);
        font: inherit;
        font-weight: 600;
      }

      footer {
        color: var(--muted);
        font-size: 11px;
      }

      .animate .wordmark path {
        stroke-dasharray: 1 1.01;
        stroke-dashoffset: 1.001;
        animation: write 1.8s cubic-bezier(0.23, 1, 0.32, 1) 0.1s forwards;
      }

      @keyframes write {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .animate .wordmark path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }

      @media (max-width: 600px) {
        .start {
          padding: 24px;
        }

        .welcome {
          padding-bottom: 4vh;
        }

        .shortcut {
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="start">
      <div class="brand">
        <svg viewBox="274 254 482 622" aria-hidden="true">
          <g fill="none" stroke-width="96" stroke-linecap="round">
            <path d="M330 310 L450 470" stroke="#7652a7" />
            <path d="M700 310 L470 770 Q445 820 385 820" stroke="currentColor" />
          </g>
        </svg>
        <span>yalqen</span>
      </div>
      <section class="welcome">
        <span class="eyebrow">Yeni sekme</span>
        <svg class="wordmark" viewBox="0 40 500 180" role="img" aria-label="merhaba">
      <defs>
        <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="480" y2="0">
          <stop offset="0" stop-color="#7a60ad" />
          <stop offset="0.35" stop-color="#ab80c2" />
          <stop offset="0.7" stop-color="#d49bbf" />
          <stop offset="1" stop-color="#8b6ab8" />
        </linearGradient>
      </defs>
      <!-- A single stroke of handwriting: "merhaba". -->
      <path
        pathLength="1"
        fill="none"
        stroke="url(#ink)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="
          M 18 204 C 30 198 40 170 42 142 L 41 200
          C 45 162 52 140 63 140 C 75 140 80 150 80 165 L 80 200
          C 84 162 92 140 103 140 C 115 140 120 150 120 165 L 120 188 C 120 200 128 204 138 200
          C 150 194 168 178 167 158 C 166 144 152 138 144 150 C 136 164 138 196 158 201 C 170 204 180 198 188 188
          C 194 170 198 152 200 141 C 206 147 213 147 220 141 C 217 162 215 185 217 199 C 221 204 229 200 236 190
          C 252 160 272 96 268 70 C 265 52 245 54 246 80 C 247 120 247 170 247 200
          C 251 162 259 140 270 140 C 282 140 286 150 286 165 L 286 188 C 286 198 290 202 296 200
          C 300 186 304 160 318 145 C 324 139 334 140 338 145 C 326 136 310 142 307 166 C 304 192 320 204 332 190 C 338 180 340 160 340 142 L 340 188 C 340 200 346 204 354 199
          C 370 160 390 96 386 70 C 383 52 363 54 364 80 C 365 120 365 170 365 198 C 369 168 381 142 397 148 C 409 154 405 190 386 199 C 377 203 375 186 389 182 C 399 179 406 170 414 158
          C 420 148 434 140 446 145 C 434 136 418 142 415 166 C 412 192 428 204 440 190 C 446 180 448 160 448 142 L 448 188 C 448 202 462 206 480 194
        "
      />
        </svg>
        <h1>Bugün nereye gidelim?</h1>
        <p>Aramak veya bir adres açmak için adres çubuğuna geç.</p>
        <div class="shortcut"><span>Adres çubuğu</span><kbd>⌘ L</kbd></div>
      </section>
      <footer>Yeni bir sayfa aç, keşfe devam et.</footer>
    </main>
  </body>
</html>
