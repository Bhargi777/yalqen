<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yeni sekme</title>
    <!--
      Served as yalqen://newtab/ by the main process, which fills in the recently
      closed pages. The search form submits to yalqen://newtab/search?q=…, which the
      main process turns into a navigation; the page itself runs no scripts.
    -->
    <style>
      /* The view is transparent so the native window material remains visible. */
      :root {
        --page: transparent;
        --text: #1a1b1e;
        --hint: #a4a7ad;
        --muted: #50545b;
        --surface: rgb(255 255 255 / 0.82);
        --well: rgb(255 255 255 / 0.38);
        --hover: rgb(0 0 0 / 0.04);
        --shadow: 0 0 0 0.5px rgb(16 18 24 / 0.12), 0 5px 18px rgb(16 18 24 / 0.1);
        --accent: #f28c28;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: transparent;
          --text: #eceef1;
          --hint: #53565d;
          --muted: #c2c3c9;
          --surface: rgb(39 38 41 / 0.82);
          --well: rgb(14 14 16 / 0.32);
          --hover: rgb(255 255 255 / 0.05);
          --shadow: 0 0 0 0.5px rgb(255 255 255 / 0.18), 0 6px 18px rgb(0 0 0 / 0.24);
          --accent: #f28c28;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--page);
      }

      body {
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font: 15px / 1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        :root {
          --page: #e6e8eb;
          --surface: #fff;
          --well: #dcdfe3;
          --muted: #4a4e54;
        }
      }

      @media (prefers-color-scheme: dark) and (prefers-reduced-transparency: reduce),
        (prefers-color-scheme: dark) and (prefers-contrast: more) {
        :root {
          --page: #141517;
          --surface: #26282c;
          --well: #1e2023;
          --muted: #c2c3c9;
        }
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, 100%);
        padding: 0 24px 6vh;
      }

      form {
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(640px, 100%);
        height: 52px;
        margin: 0 auto;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.14), 0 14px 40px rgb(0 0 0 / 0.16);
      }

      .prompt {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 17px;
        text-align: left;
        user-select: text;
      }

      .prompt::placeholder {
        color: var(--muted);
        opacity: 1;
      }

      .prompt:focus {
        outline: none;
      }

      .search-icon {
        display: grid;
        flex: none;
        place-items: center;
        color: var(--muted);
      }

      @media (prefers-color-scheme: dark) {
        form {
          box-shadow: 0 0 0 0.5px rgb(255 255 255 / 0.14), 0 12px 40px rgb(0 0 0 / 0.5);
        }
      }

      .actions {
        display: flex;
        gap: 6px;
        margin-top: 36px;
      }

      .pill {
        display: flex;
        cursor: text;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .pill.square {
        justify-content: center;
        width: 44px;
        padding: 0;
      }

      .blank {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--well);
      }

      .pill svg {
        color: var(--muted);
      }

      h2 {
        margin: 22px 0 12px;
        font-size: 15px;
        font-weight: 500;
      }

      .recent {
        width: 260px;
        margin: 0;
        padding: 6px;
        border-radius: 16px;
        background: var(--well);
        list-style: none;
      }

      .recent li {
        display: flex;
        align-items: center;
        height: 48px;
        border-radius: 11px;
        color: var(--muted);
      }

      .recent li:hover {
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--text);
      }

      .recent a:first-child {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 12px;
        min-width: 0;
        height: 100%;
        padding: 0 14px;
      }

      .forget {
        display: grid;
        flex: none;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-right: 10px;
        border-radius: 7px;
        color: var(--text);
      }

      .forget:hover {
        background: var(--hover);
      }

      .recent span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recent img,
      .dot {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 5px;
      }

      .dot {
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin-bottom: 38px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.16em;
      }

      .welcome h1 {
        margin: 0;
        font-size: clamp(30px, 4.4vw, 48px);
        font-weight: 550;
        letter-spacing: -0.04em;
        line-height: 1.08;
      }

      .welcome-copy {
        max-width: 420px;
        margin: 14px 0 24px;
        color: var(--muted);
        font-size: 15px;
      }

      .tips {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }

      .tips li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 82px;
        padding: 13px 12px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .tip-icon {
        display: grid;
        flex: none;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--well);
        color: var(--accent);
        font-size: 16px;
      }

      .tips strong,
      .tips small {
        display: block;
      }

      .tips strong {
        margin: 2px 0 4px;
        font-size: 12px;
        font-weight: 550;
      }

      .tips small {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .welcome-start {
        display: block;
        margin: 16px auto 0;
        padding: 0 18px;
        height: 42px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .welcome-start:hover {
        filter: brightness(0.96);
      }

      @media (max-width: 560px) {
        .tips {
          grid-template-columns: 1fr;
          max-width: 360px;
        }

        .tips li {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- welcome -->
      <form id="search-form" action="yalqen://newtab/search" method="get" role="search">
        <span class="search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="8.8" cy="8.8" r="5.8" />
            <path d="m13.2 13.2 4 4" />
          </svg>
        </span>
        <input
          id="q"
          class="prompt"
          name="q"
          type="text"
          placeholder="Aramak için yaz…"
          aria-label="Ara veya adres yaz"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </form>
      <!-- welcome-action -->
      <div class="actions">
        <label class="pill" for="q">
          <span class="blank"></span>
          <span>Yeni sekme</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 4.5h8M2.5 8h8M2.5 11.5h5M12 10v4M10 12h4" />
          </svg>
        </label>
        <label class="pill square" for="q" aria-label="Ara veya adres yaz">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M8 3v10M3 8h10" />
          </svg>
        </label>
      </div>
      <!-- recent -->
    </main>
  </body>
</html>
